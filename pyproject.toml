[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosync"
version = "2.0.0"
description = "EcoSync Resource Intelligence Platform — Grounded AI for Energy, Water, and Circularity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "EcoSync Team" }
]
keywords = [
    "sustainability",
    "energy-efficiency",
    "water-conservation",
    "zero-waste",
    "anomaly-detection",
    "forecasting",
    "responsible-ai",
    "ibm-granite"
]
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.18.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
ibm = [
    "ibm-watsonx-ai>=1.1.3"
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "flake8>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
